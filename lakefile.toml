name = "runs-of-multiples-lean"
version = "0.1.0"
keywords = ["math"]
license = "Apache-2.0"
defaultTargets = ["RunsOfMultiplesLean"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false # no Mathlib-style copyright headers in this project
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc4"

[[lean_lib]]
name = "RunsOfMultiplesLean"
